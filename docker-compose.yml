services:
  ml-service:
    build:
      context: ./NexaPlan.API/ml_service
      dockerfile: Dockerfile
    container_name: nexaplan-ml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always

  backend:
    build:
      context: ./NexaPlan.API
      dockerfile: Dockerfile
    container_name: nexaplan-backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ML_SERVICE_URL=http://ml-service:8000
      # You can override variables like ConnectionStrings__DefaultConnection at runtime here:
      # - ConnectionStrings__DefaultConnection=Server=your_server;Database=your_db;...
    depends_on:
      - ml-service
    restart: always

  frontend:
    build:
      context: ./nexaplan-client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/
    container_name: nexaplan-frontend
    ports:
      - "3000:80"   # HTTP
      - "3443:443"  # HTTPS (mapped to port 3443 on host)
    volumes:
      - ./nginx-selfsigned.crt:/etc/nginx/certs/server.crt:ro
      - ./nginx-selfsigned.key:/etc/nginx/certs/server.key:ro
    depends_on:
      - backend
    restart: always

